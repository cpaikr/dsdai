[workspace]
members = ["crates/dsd", "crates/dsd-cli"]
default-members = ["crates/dsd", "crates/dsd-cli"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Elastic-2.0"
repository = "https://github.com/cpaikr/dsdai"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
encoding_rs = "0.8.35"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
fs4 = "0.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tar = { version = "0.4.44", default-features = false }
thiserror = "2.0"
# Only release checks and upgrades start a runtime, and only for network work.
tokio = { version = "1.49.0", default-features = false, features = ["net", "rt", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
naive_bytecount = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
