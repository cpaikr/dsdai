[package]
name = "dsd-cli"
description = "Command-line interface for reading and editing DART Editor .dsd documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Test-only: lets integration tests point release checks and upgrades at a
# local fixture origin. Release packaging refuses executables built with it.
fixture-origin = []

[[bin]]
name = "dsd"
path = "src/main.rs"
doc = false

[dependencies]
chrono.workspace = true
clap.workspace = true
dsd = { path = "../dsd" }
flate2.workspace = true
fs4.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
crc32fast.workspace = true
encoding_rs.workspace = true
